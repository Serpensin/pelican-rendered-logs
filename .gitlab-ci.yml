include:
  - template: Security/Secret-Detection.gitlab-ci.yml

stages: [test, secret-detection, release]

variables:
  SECRET_DETECTION_ENABLED: 'true'

php-syntax:
  image: php:8.3-cli
  stage: test
  script:
    - find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
    - php tests/TerminalHtmlDocumentTest.php
    - php -r "json_decode(file_get_contents('plugin.json'), true, 512, JSON_THROW_ON_ERROR); json_decode(file_get_contents('update.json'), true, 512, JSON_THROW_ON_ERROR);"

create-release-tag:
  image: alpine:3.20
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [update.json]
    - when: never
  before_script:
    - apk add --no-cache git python3
  script:
    - git fetch --tags origin
    - python3 scripts/ci_detect_release_version.py
    - set -a; . ./release.env; set +a
    - if [ "$SHOULD_CREATE_TAG" != "true" ]; then echo 'No untagged update.json version found.'; exit 0; fi
    - python3 scripts/ci_create_release_tag.py
  artifacts:
    reports: { dotenv: release.env }
    paths: [release.env]
    expire_in: 1 week

release-zip:
  image: alpine:3.20
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never
  before_script:
    - apk add --no-cache zip curl python3
  script:
    - python3 scripts/ci_assert_tag_in_update_json.py
    - python3 scripts/package.py
    - cp dist/serpensin-rendered-logs.zip serpensin-rendered-logs.zip
    - test -s serpensin-rendered-logs.zip
    - |
      package_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/serpensin-rendered-logs/${CI_COMMIT_TAG#v}/serpensin-rendered-logs.zip"
      upload_status=$(curl --silent --show-error --output /tmp/package-response.json --write-out '%{http_code}' --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file serpensin-rendered-logs.zip "$package_url")
      if [ "$upload_status" != "201" ] && [ "$upload_status" != "400" ] && [ "$upload_status" != "409" ]; then cat /tmp/package-response.json || true; exit 1; fi
    - |
      curl --fail --request POST --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --form "name=Release ${CI_COMMIT_TAG}" --form "tag_name=${CI_COMMIT_TAG}" --form "description=Automated release for ${CI_COMMIT_TAG}" --form "assets[links][][name]=serpensin-rendered-logs.zip" --form "assets[links][][url]=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/serpensin-rendered-logs/${CI_COMMIT_TAG#v}/serpensin-rendered-logs.zip" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases" || curl --fail --request PUT --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --form "description=Automated release for ${CI_COMMIT_TAG}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}"
  artifacts:
    paths: [serpensin-rendered-logs.zip]
    expire_in: 1 week
