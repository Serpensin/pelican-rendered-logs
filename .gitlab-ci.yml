include:
  - template: Security/Secret-Detection.gitlab-ci.yml

stages: [test, secret-detection, tag]

variables:
  SECRET_DETECTION_ENABLED: 'true'

php-syntax:
  image: php:8.3-cli
  stage: test
  script:
    - find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
    - php tests/TerminalHtmlDocumentTest.php
    - php tests/WingsWebsocketProtocolTest.php
    - php -r '$plugin = json_decode(file_get_contents("plugin.json"), true, 512, JSON_THROW_ON_ERROR); json_decode(file_get_contents("update.json"), true, 512, JSON_THROW_ON_ERROR); $expected = "https://hub.pelican.dev/plugins/" . $plugin["id"] . "/update.json"; if (($plugin["update_url"] ?? null) !== $expected) { throw new RuntimeException("plugin.json update_url must use Pelican Hub"); }'

create-release-tag:
  image: alpine:3.20
  stage: tag
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes: [plugin.json, update.json]
    - when: never
  before_script:
    - apk add --no-cache git python3
  script:
    - git fetch --tags origin
    - python3 scripts/ci_create_release_tag.py
